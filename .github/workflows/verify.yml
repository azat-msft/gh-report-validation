name: Verify GitHub Actions report extension

# Verifies that every workflow command emitted by
# Microsoft.Testing.Extensions.GitHubActionsReport is implemented correctly and is
# picked up by the GitHub Actions UI:
#   - ::group:: / ::endgroup::   -> collapsible log sections
#   - ::error file,line,...      -> failure annotations (Annotations tab + diff gutter)
#   - ::notice ...               -> slow-test notices (Annotations tab)
#   - markdown -> $GITHUB_STEP_SUMMARY -> the run's Summary page
#
# GITHUB_ACTIONS / GITHUB_WORKSPACE / GITHUB_STEP_SUMMARY are set automatically by the
# runner, which is what activates the extension and routes the job summary to the run page.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The extension is consumed as a NuGet package from the committed ./local-packages feed
      # (wired in via nuget.config), so restore connects it to the solution at build time.
      - name: Restore
        run: dotnet restore gh-report-validation.slnx

      # Required: build the solution before running the tests.
      - name: Build
        run: dotnet build gh-report-validation.slnx -c Release --no-restore

      # Run BOTH test projects in a single step so the per-assembly ::group:: / ::endgroup:: sections
      # are nested inside one log section. This proves the grouping comes from the extension's workflow
      # commands rather than from GitHub's automatic per-step log folding (each step is its own group).
      #
      # 'set +e' disables the default errexit so the first failing project does not abort the step; we
      # capture each project's exit code and fail the step at the end if either failed, so the run
      # conclusion still reflects the test results while all annotations and the job summary are produced.
      # The slow test in CalculatorTests exercises ::notice via a low threshold; StringUtilsTests contains
      # deliberately failing tests that exercise ::error annotations and the "Failures" summary section.
      #
      # The 30 Bulk*Tests projects then run into the SAME summary file, which is the scenario under test:
      # GitHub caps GITHUB_STEP_SUMMARY at 1 MiB for the whole step, so 30 projects each writing failure
      # diagnostics must share that budget rather than each claiming it. If the file exceeded the cap GitHub
      # would silently drop the entire summary, so the verification below asserts the size explicitly.
      - name: Run tests
        run: |
          set +e
          dotnet run --project CalculatorTests/CalculatorTests.csproj -c Release --no-build -- --report-gh --report-gh-slow-test-threshold 1
          calculator=$?
          dotnet run --project StringUtilsTests/StringUtilsTests.csproj -c Release --no-build -- --report-gh
          stringutils=$?
          echo "Test project exit codes: calculator=$calculator, stringutils=$stringutils"

          echo "::group::Bulk test projects"
          bulk_failures=0
          for project in Bulk*Tests; do
            dotnet run --project "$project/$project.csproj" -c Release --no-build -- --report-gh > /dev/null 2>&1
            bulk_exit=$?
            echo "$project exited with $bulk_exit"
            if [ $bulk_exit -ne 0 ]; then
              bulk_failures=$((bulk_failures + 1))
            fi
          done
          echo "Bulk projects with failures: $bulk_failures"
          echo "::endgroup::"

          # GITHUB_STEP_SUMMARY is a per-step file, so the summary written by the reporters above can only
          # be inspected from within this same step. Echo its size and the markers that prove which
          # rendering path was taken, so the run log documents what the Summary page shows.
          echo "::group::Job summary verification"
          summary_bytes=$(wc -c < "$GITHUB_STEP_SUMMARY")
          echo "Summary size: $summary_bytes bytes"
          echo "GitHub limit: 1048576 bytes"
          echo "Project sections: $(grep -c '^## .* Test Run Summary' "$GITHUB_STEP_SUMMARY" || true)"
          echo "Collapsible failure sections: $(grep -c '^<details>' "$GITHUB_STEP_SUMMARY" || true)"
          echo "Clipped values: $(grep -c '\[\.\.\. truncated\]' "$GITHUB_STEP_SUMMARY" || true)"
          notice_count=$(grep -c 'microsoft-testing-platform:github:summary-truncated' "$GITHUB_STEP_SUMMARY" || true)
          echo "Closing truncation notes: $notice_count"
          if [ "$notice_count" -gt 0 ]; then
            # The note must be stated once and must lead the report: co-writers only ever append, so the top is the
            # one position nothing else can displace, and it is where a reader meets it before the affected sections.
            if [ "$notice_count" -ne 1 ]; then
              echo "::error::Expected exactly one truncation note, found $notice_count."
              exit 1
            fi
            notice_line=$(grep -n 'microsoft-testing-platform:github:summary-truncated' "$GITHUB_STEP_SUMMARY" | cut -d: -f1)
            echo "Note at line $notice_line"
            if [ "$notice_line" -ne 1 ]; then
              echo "::error::The truncation note is at line $notice_line, not at the top of the summary."
              exit 1
            fi
            echo "--- Note as rendered ---"
            sed -n '1,3p' "$GITHUB_STEP_SUMMARY"
          fi
          grep -E 'Showing the first [0-9]+ of [0-9]+ failed tests|job summary size limit was reached' "$GITHUB_STEP_SUMMARY" || echo "No truncation notes (summary rendered in full)."

          # The summary is only rendered by GitHub if it stays under the cap. Failing here would mean the
          # budgeting is broken and the whole summary would have been dropped from the run page.
          if [ "$summary_bytes" -ge 1048576 ]; then
            echo "::error::Job summary is $summary_bytes bytes, at or over GitHub's 1 MiB limit. GitHub will drop it."
            exit 1
          fi
          echo "::endgroup::"

          # Keep a copy for post-run structural inspection: GITHUB_STEP_SUMMARY is a per-step temp file that is
          # consumed by the runner, so it cannot be read from a later step or downloaded afterwards.
          cp "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/job-summary.md"

          if [ $calculator -ne 0 ] || [ $stringutils -ne 0 ] || [ $bulk_failures -ne 0 ]; then
            echo "One or more test projects failed."
            exit 1
          fi

      # The bulk projects fail on purpose, so the step above always ends non-zero; upload regardless so the
      # rendered summary can be inspected after the run.
      - name: Upload job summary for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-summary
          path: job-summary.md
          if-no-files-found: error
