name: Verify GitHub Actions report extension

# Verifies that every workflow command emitted by
# Microsoft.Testing.Extensions.GitHubActionsReport is implemented correctly and is
# picked up by the GitHub Actions UI:
#   - ::group:: / ::endgroup::   -> collapsible log sections
#   - ::error file,line,...      -> failure annotations (Annotations tab + diff gutter)
#   - ::notice ...               -> slow-test notices (Annotations tab)
#   - markdown -> $GITHUB_STEP_SUMMARY -> the run's Summary page
#
# GITHUB_ACTIONS / GITHUB_WORKSPACE / GITHUB_STEP_SUMMARY are set automatically by the
# runner, which is what activates the extension and routes the job summary to the run page.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The extension is consumed as a NuGet package from the committed ./local-packages feed
      # (wired in via nuget.config), so restore connects it to the solution at build time.
      - name: Restore
        run: dotnet restore gh-report-validation.slnx

      # Required: build the solution before running the tests.
      - name: Build
        run: dotnet build gh-report-validation.slnx -c Release --no-restore

      # Run BOTH test projects in a single step so the per-assembly ::group:: / ::endgroup:: sections
      # are nested inside one log section. This proves the grouping comes from the extension's workflow
      # commands rather than from GitHub's automatic per-step log folding (each step is its own group).
      #
      # 'set +e' disables the default errexit so the first failing project does not abort the step; we
      # capture each project's exit code and fail the step at the end if either failed, so the run
      # conclusion still reflects the test results while all annotations and the job summary are produced.
      # The slow test in CalculatorTests exercises ::notice via a low threshold; StringUtilsTests contains
      # deliberately failing tests that exercise ::error annotations and the "Failures" summary section.
      - name: Run tests
        run: |
          set +e
          dotnet run --project CalculatorTests/CalculatorTests.csproj -c Release --no-build -- --report-gh --report-gh-slow-test-threshold 1
          calculator=$?
          dotnet run --project StringUtilsTests/StringUtilsTests.csproj -c Release --no-build -- --report-gh
          stringutils=$?
          echo "Test project exit codes: calculator=$calculator, stringutils=$stringutils"

          # GITHUB_STEP_SUMMARY is a per-step file, so the summary written by the reporters above can only
          # be inspected from within this same step. Echo its size and the markers that prove which
          # rendering path was taken, so the run log documents what the Summary page shows.
          echo "::group::Job summary verification"
          echo "Summary size: $(wc -c < "$GITHUB_STEP_SUMMARY") bytes"
          echo "Collapsible failure sections: $(grep -c '^<details>' "$GITHUB_STEP_SUMMARY" || true)"
          echo "Clipped values: $(grep -c '\[\.\.\. truncated\]' "$GITHUB_STEP_SUMMARY" || true)"
          grep -E 'Showing the first [0-9]+ of [0-9]+ failed tests|job summary size limit was reached' "$GITHUB_STEP_SUMMARY" || echo "No truncation notes (summary rendered in full)."
          echo "::endgroup::"

          if [ $calculator -ne 0 ] || [ $stringutils -ne 0 ]; then
            echo "One or more test projects failed."
            exit 1
          fi
